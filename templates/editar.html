<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto - TALLER.TCI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <span class="navbar-brand fw-bold text-uppercase">TALLER<span class="text-success">.TCI</span> — Editar Producto</span>
            <a href="/admin/panel" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left"></i> Volver al Panel</a>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6">
                <div class="card shadow-sm border-0 rounded-3 p-4 bg-white">
                    <h4 class="fw-bold mb-3">Editar: {{ producto.nombre }}</h4>
                    
                    <form method="POST" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Nombre del Producto</label>
                            <input type="text" class="form-control" name="nombre" value="{{ producto.nombre }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Categoría</label>
                            <select class="form-select" name="categoria" required>
                                <option value="Sublimacion" {% if producto.categoria == 'Sublimacion' %}selected{% endif %}>Sublimación</option>
                                <option value="Merchandising" {% if producto.categoria == 'Merchandising' %}selected{% endif %}>Merchandising</option>
                                <option value="Papeleria" {% if producto.categoria == 'Papeleria' %}selected{% endif %}>Papelería</option>
                                <option value="Cristaleria" {% if producto.categoria == 'Cristaleria' %}selected{% endif %}>Cristalería</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Precio Normal (S/.)</label>
                            <input type="number" step="0.01" class="form-control" name="precio_normal" value="{{ producto.precio_normal }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Precio Oferta (Opcional)</label>
                            <input type="number" step="0.01" class="form-control" name="precio_oferta" value="{{ producto.precio_oferta if producto.precio_oferta else '' }}">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label small fw-bold">% Descuento (Opcional)</label>
                            <input type="number" class="form-control" name="descuento" value="{{ producto.descuento if producto.descuento else '' }}">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Descripción</label>
                            <textarea class="form-control" name="descripcion" rows="3">{{ producto.descripcion }}</textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-success">Gestión de Imagen</label>
                            {% if producto.imagen %}
                            <div class="mb-2 d-flex align-items-center gap-3 border p-2 rounded bg-light">
                                <img src="{{ url_for('static', filename=producto.imagen) }}" width="60" height="60" class="rounded object-fit-cover border">
                                <div>
                                    <div class="form-check text-danger">
                                        <input class="form-check-input" type="checkbox" name="eliminar_imagen" value="si" id="eliminarImg">
                                        <label class="form-check-label small fw-bold" for="eliminarImg">
                                            Eliminar foto actual
                                        </label>
                                    </div>
                                    <span class="text-muted" style="font-size: 0.75rem;">O selecciona abajo una nueva para reemplazarla</span>
                                </div>
                            </div>
                            {% endif %}
                            <input type="file" class="form-control" name="imagen">
                        </div>
                        
                        <button type="submit" class="btn btn-success w-100 fw-bold py-2"><i class="bi bi-save"></i> Actualizar Producto</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
