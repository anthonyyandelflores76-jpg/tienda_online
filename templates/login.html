<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Admin - TALLER.TCI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card shadow-sm p-4 border-0 rounded-4" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-uppercase">TALLER<span class="text-success">.TCI</span></h3>
            <p class="text-muted small">Panel de Gestión Interna</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 small text-center" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label for="password" class="form-label small fw-bold">Contraseña de Administrador</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Ingresa la contraseña" required autofocus>
            </div>
            <button type="submit" class="btn btn-dark w-100 py-2 fw-bold">Ingresar al Panel</button>
        </form>

        <div class="text-center mt-3">
            <a href="/" class="text-decoration-none small text-muted">&larr; Volver a la tienda</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
